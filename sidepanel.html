<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="sidePanelTitle">AI Chat</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <h1 data-i18n="sidePanelTitle">AI Chat</h1>
        <p id="baseUrlSummary" class="model-summary"></p>
      </div>
      <div class="model-picker">
        <input id="modelInput" type="text" list="modelList" data-i18n-placeholder="modelPlaceholder" placeholder="Enter or select model name" autocomplete="off">
        <datalist id="modelList"></datalist>
        <button id="fetchModelsBtn" type="button" data-i18n="modelFetchBtn">Fetch</button>
      </div>
    </header>

    <section id="contextBox" class="context-box" hidden>
      <div class="context-head">
        <span data-i18n="sidePanelContextTitle">Page context</span>
        <button id="clearContextBtn" class="plain-btn" type="button" data-i18n="sidePanelClearContext">Clear</button>
      </div>
      <p id="contextText" class="context-text"></p>
      <div id="contextImages" class="context-images"></div>
    </section>

    <main id="messages" class="messages" aria-live="polite"></main>

    <div class="quick-prompts">
      <select id="quickPromptSelect" data-i18n-title="quickPromptsLabel" title="Quick Prompts">
        <option value="" data-i18n="quickPromptsLabel">Quick Prompts</option>
      </select>
    </div>

    <footer class="composer">
      <div id="status" class="status" role="status"></div>
      <div class="toolbar">
        <button id="useSelectionBtn" class="tool-btn" type="button" data-i18n="sidePanelUseSelection">Use selection</button>
        <button id="clearChatBtn" class="tool-btn" type="button" data-i18n="sidePanelClearChat">Clear chat</button>
      </div>
      <div class="input-row">
        <textarea id="messageInput" rows="1" data-i18n-placeholder="dialogInputPlaceholder" placeholder="Type your question..."></textarea>
        <button id="sendBtn" type="button" data-i18n="dialogSendBtn">Send</button>
      </div>
    </footer>
  </div>

  <script src="lib/utils.js"></script>
  <script src="lib/markdown.js"></script>
  <script src="lib/chat.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
